        <h1 id="page-title">Adding New Members</h1>

    <div class="main-content">
        <div class="box">
            <div class="header">
                <p class="bball_emoji">🏀</p>
                <h1>Adding New Members:</h1>
                <p class="subtitle">Basketball Varsity Roster</p>
            </div>

            <br>

            <div class="input">
                <label for="first_name">First Name</label>
                <input type="text" id="first_name" placeholder="Ex. Jane" required autocomplete="off">
            </div>

            <div class="input">
                <label for="last_name">Last Name</label>
                <input type="text" id="last_name" placeholder="Ex. Doe" autocomplete="off">
            </div>

            <button class="button" py-click="adding">Add Member</button>

            <div id="result"></div>
        </div>

        <div class="box" id="members">
            <p>All Members:</p>
            <br>
            <p id="normal"></p>
            <br>
            <p id="total">Total Members: </p>
        </div>
    </div>
